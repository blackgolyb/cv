[project]
name = "cv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.11.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
]

[tool.ruff]
extend-select = [
    "I",  #isort
    "UP", #pyupgrade
    "F",  #pyflakes
]
